<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria del Peregrino - Rincón de la Lectura</title>
<link href="https://fonts.googleapis.com/css?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: linear-gradient(135deg, #e8f5e9, #fffde7);
    font-family: 'Quicksand', sans-serif;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-family: 'Fredoka One', cursive;
    color: #2E7D32;
    font-size: 2.3rem;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
}

header p {
    font-size: 1.05rem;
    color: #555;
    font-weight: 700;
}

.juego-contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 650px;
    width: 100%;
}

.info-juego {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: #2E7D32;
}

/* TABLERO DE MEMORIA (4x3 = 12 cartas / 6 parejas) */
.tablero-memoria {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    width: 100%;
    max-width: 500px;
    margin-bottom: 25px;
}

.carta {
    aspect-ratio: 1;
    background-color: #4CAF50;
    border-radius: 15px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    box-shadow: 0 6px 0 #388E3C;
    transition: transform 0.2s, background-color 0.2s;
    position: relative;
    transform-style: preserve-3d;
}

.carta:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #388E3C;
}

.carta.volteada {
    background-color: #ffffff;
    border: 3px solid #4CAF50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    cursor: default;
}

.carta.encontrada {
    background-color: #C8E6C9;
    border: 3px solid #388E3C;
    box-shadow: none;
    cursor: default;
    animation: pulso 0.4s;
}

@keyframes pulso {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.acciones-inferiores {
    display: flex;
    gap: 15px;
    width: 100%;
    justify-content: center;
}

.btn-accion {
    background: #2ECC40;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #218838;
    transition: all 0.1s;
}

.btn-accion:active {
    transform: translateY(3px);
    box-shadow: none;
}

.btn-volver {
    background: #FF4136;
    box-shadow: 0 4px 0 #c82333;
    text-decoration: none;
    text-align: center;
    display: inline-block;
    padding: 12px 25px;
    border-radius: 50px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
}

/* MENSAJE DE VICTORIA */
#mensaje-victoria {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border: 5px solid #FFD700;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: aparecer 0.3s ease-out;
}

#mensaje-victoria h2 {
    font-family: 'Fredoka One', cursive;
    color: #2ECC40;
    font-size: 2rem;
    margin-bottom: 10px;
}

@keyframes aparecer {
    from { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
</style>
</head>
<body>

<header>
    <h1>6. Memoria del Peregrino</h1>
    <p>¡Encuentra las parejas de símbolos sagrados y tradiciones de nuestra ruta!</p>
</header>

<div class="juego-contenedor">
    <div class="info-juego">
        <span id="contador-intentos">Intentos: 0</span>
        <span id="contador-parejas">Parejas: 0 / 6</span>
    </div>

    <!-- TABLERO DE MEMORIA -->
    <div class="tablero-memoria" id="tablero-memoria"></div>

    <div class="acciones-inferiores">
        <button class="btn-accion" onclick="reiniciarMemoria()">Reiniciar</button>
        <a href="javascript:window.close();" class="btn-volver">Cerrar Juego</a>
    </div>
</div>

<!-- VENTANA DE VICTORIA -->
<div id="mensaje-victoria">
    <h2>¡Memoria Excepcional!</h2>
    <p>Has encontrado todas las parejas con gran atención y memoria. ¡Felicitaciones!</p>
    <button class="btn-accion" onclick="reiniciarMemoria(); cerrarVictoria();" style="margin-top: 15px;">Jugar de Nuevo</button>
</div>

<script>
// Iconos/emojis temáticos para las 6 parejas de memoria
const iconosCartas = ['⛪', '🕊️', '👑', '🕯️', '🎒', '🌸'];

let cartasJuego = [];
let primeraCarta = null;
let segundaCarta = null;
let bloqueoTablero = false;
let intentos = 0;
let parejasEncontradas = 0;

function iniciarMemoria() {
    intentos = 0;
    parejasEncontradas = 0;
    primeraCarta = null;
    segundaCarta = null;
    bloqueoTablero = false;
    actualizarMarcadores();
    document.getElementById('mensaje-victoria').style.display = 'none';

    // Duplicar elementos para hacer las parejas y barajar
    cartasJuego = [...iconosCartas, ...iconosCartas]
        .sort(() => Math.random() - 0.5);

    renderizarTablero();
}

function renderizarTablero() {
    const tablero = document.getElementById('tablero-memoria');
    tablero.innerHTML = '';

    cartasJuego.forEach((icono, indice) => {
        const carta = document.createElement('div');
        carta.classList.add('carta');
        carta.dataset.icono = icono;
        carta.dataset.indice = indice;

        carta.addEventListener('click', () => voltearCarta(carta, icono));
        tablero.appendChild(carta);
    });
}

function voltearCarta(carta, icono) {
    if (bloqueoTablero) return;
    if (carta === primeraCarta) return;
    if (carta.classList.contains('encontrada')) return;

    carta.classList.add('volteada');
    carta.innerText = icono;

    if (!primeraCarta) {
        primeraCarta = carta;
        return;
    }

    segundaCarta = carta;
    intentos++;
    actualizarMarcadores();

    verificarPareja();
}

function verificarPareja() {
    const esCoincidencia = primeraCarta.dataset.icono === segundaCarta.dataset.icono;

    if (esCoincidencia) {
        deshabilitarCartas();
    } else {
        desvoltearCartas();
    }
}

function deshabilitarCartas() {
    primeraCarta.classList.add('encontrada');
    segundaCarta.classList.add('encontrada');

    parejasEncontradas++;
    actualizarMarcadores();

    resetearSeleccion();

    if (parejasEncontradas === iconosCartas.length) {
        setTimeout(() => {
            document.getElementById('mensaje-victoria').style.display = 'block';
        }, 400);
    }
}

function desvoltearCartas() {
    bloqueoTablero = true;

    setTimeout(() => {
        primeraCarta.classList.remove('volteada');
        primeraCarta.innerText = '';
        segundaCarta.classList.remove('volteada');
        segundaCarta.innerText = '';

        resetearSeleccion();
    }, 900);
}

function resetearSeleccion() {
    [primeraCarta, segundaCarta] = [null, null];
    bloqueoTablero = false;
}

function actualizarMarcadores() {
    document.getElementById('contador-intentos').innerText = `Intentos: ${intentos}`;
    document.getElementById('contador-parejas').innerText = `Parejas: ${parejasEncontradas} / ${iconosCartas.length}`;
}

function cerrarVictoria() {
    document.getElementById('mensaje-victoria').style.display = 'none';
}

// Inicializar al cargar
iniciarMemoria();
</script>

</body>
</html>
