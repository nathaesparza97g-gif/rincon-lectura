<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz del Peregrino - Rincón de la Lectura</title>
<link href="https://fonts.googleapis.com/css?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: linear-gradient(135deg, #e8f5e9, #e0f7fa);
    font-family: 'Quicksand', sans-serif;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-family: 'Fredoka One', cursive;
    color: #2ECC40;
    font-size: 2.3rem;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
}

header p {
    font-size: 1.05rem;
    color: #555;
    font-weight: 700;
}

.juego-contenedor {
    display: flex;
    flex-direction: column;
    background: #ffffff;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 650px;
    width: 100%;
}

.barra-progreso {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-family: 'Fredoka One', cursive;
    color: #0074D9;
    font-size: 1.1rem;
}

.caja-pregunta {
    margin-bottom: 25px;
}

.caja-pregunta h2 {
    font-family: 'Fredoka One', cursive;
    color: #333;
    font-size: 1.4rem;
    line-height: 1.4;
    margin-bottom: 15px;
    text-align: center;
}

.imagen-pregunta {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 12px;
    margin-bottom: 15px;
    display: none;
}

.opciones-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn-opcion {
    background: #f8f9fa;
    border: 3px solid #ddd;
    border-radius: 15px;
    padding: 15px 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: #444;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
}

.btn-opcion:hover:not(:disabled) {
    background: #e3f2fd;
    border-color: #0074D9;
    transform: scale(1.01);
}

.btn-opcion.correcto {
    background: #d4edda !important;
    border-color: #2ECC40 !important;
    color: #155724;
}

.btn-opcion.incorrecto {
    background: #f8d7da !important;
    border-color: #FF4136 !important;
    color: #721c24;
}

.acciones-inferiores {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
    border-top: 2px solid #eee;
    padding-top: 20px;
}

.btn-siguiente {
    background: #2ECC40;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #218838;
    display: none;
    transition: all 0.1s;
}

.btn-siguiente:active {
    transform: translateY(3px);
    box-shadow: none;
}

.btn-volver {
    background: #FF4136;
    box-shadow: 0 4px 0 #c82333;
    text-decoration: none;
    text-align: center;
    padding: 12px 25px;
    border-radius: 50px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
}

/* PANTALLA FINAL DE RESULTADOS */
#pantalla-final {
    display: none;
    text-align: center;
}

#pantalla-final h2 {
    font-family: 'Fredoka One', cursive;
    color: #2ECC40;
    font-size: 2.2rem;
    margin-bottom: 15px;
}

#pantalla-final p {
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 25px;
}
</style>
</head>
<body>

<header>
    <h1>3. Quiz del Peregrino</h1>
    <p>¡Pon a prueba tus conocimientos sobre la historia y las tradiciones de nuestra comunidad!</p>
</header>

<div class="juego-contenedor">
    <!-- CONTENEDOR DEL QUIZ -->
    <div id="contenedor-quiz">
        <div class="barra-progreso">
            <span id="texto-pregunta-num">Pregunta 1 de 4</span>
            <span id="texto-puntaje">Puntaje: 0</span>
        </div>

        <div class="caja-pregunta">
            <img id="imagen-pregunta" class="imagen-pregunta" src="" alt="Ilustración pregunta" onerror="this.style.display='none'">
            <h2 id="enunciado-pregunta">¿Cargando pregunta...</h2>
            
            <div class="opciones-grid" id="opciones-grid">
                <!-- Opciones inyectadas por JS -->
            </div>
        </div>

        <div class="acciones-inferiores">
            <a href="javascript:window.close();" class="btn-volver">Cerrar Juego</a>
            <button id="btn-siguiente" class="btn-siguiente" onclick="siguientePregunta()">Siguiente</button>
        </div>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="pantalla-final">
        <h2>¡Quiz Completado!</h2>
        <p id="texto-resultado-final">Has respondido correctamente todas las preguntas.</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button class="btn-siguiente" style="display: inline-block;" onclick="reiniciarQuiz()">Jugar de Nuevo</button>
            <a href="javascript:window.close();" class="btn-volver">Cerrar Juego</a>
        </div>
    </div>
</div>

<script>
// Preguntas del Quiz (puedes editar textos o agregar propiedades 'imagen' si deseas ilustrarlas)
const preguntasQuiz = [
    {
        pregunta: "¿En qué provincia del Ecuador se encuentra la ciudad de Loja?",
        opcion: [
            "Provincia de Loja",
            "Provincia del Azuay",
            "Provincia de Pichincha"
        ],
        respuesta: 0,
        imagen: "loja_quiz.png" // Opcional: coloca tu imagen en la carpeta si deseas que aparezca
    },
    {
        pregunta: "¿Cómo se le llama popularmente a la sagrada imagen de la Virgen del Cisne?",
        opcion: [
            "La Madre del Valle",
            "La Churona",
            "La Generala"
        ],
        respuesta: 1,
        imagen: "virgen_quiz.png"
    },
    {
        pregunta: "¿A qué barrio pertenece la Escuela de Educación Básica Rosa Josefina Burneo de Burneo?",
        opcion: [
            "Barrio El Valle",
            "Barrio Turunuma",
            "Barrio Belén"
        ],
        respuesta: 1,
        imagen: "escuela_quiz.png"
    },
    {
        pregunta: "¿Cuál es uno de los principales motivos por los que Loja es mundialmente conocida?",
        opcion: [
            "Capital Cultural y Musical del Ecuador",
            "Por sus grandes puertos marítimos",
            "Por la producción de cacao fino"
        ],
        respuesta: 0,
        imagen: "cultura_quiz.png"
    }
];

let indicePreguntaActual = 0;
let puntaje = 0;
let respondido = false;

function cargarPregunta() {
    respondido = false;
    let actual = preguntasQuiz[indicePreguntaActual];

    document.getElementById('texto-pregunta-num').innerText = `Pregunta ${indicePreguntaActual + 1} de ${preguntasQuiz.length}`;
    document.getElementById('texto-puntaje').innerText = `Puntaje: ${puntaje}`;
    document.getElementById('enunciado-pregunta').innerText = actual.pregunta;

    // Manejo de imagen opcional por pregunta
    let imgElement = document.getElementById('imagen-pregunta');
    if (actual.imagen) {
        imgElement.src = actual.imagen;
        imgElement.style.display = 'block';
        imgElement.onerror = function() { this.style.display = 'none'; };
    } else {
        imgElement.style.display = 'none';
    }

    let gridOpciones = document.getElementById('opciones-grid');
    gridOpciones.innerHTML = '';

    actual.opcion.forEach((textoOpcion, index) => {
        let btn = document.createElement('button');
        btn.classList.add('btn-opcion');
        btn.innerText = `${String.fromCharCode(65 + index)}. ${textoOpcion}`;
        btn.onclick = () => seleccionarRespuesta(index, btn);
        gridOpciones.appendChild(btn);
    });

    document.getElementById('btn-siguiente').style.display = 'none';
}

function seleccionarRespuesta(indiceSeleccionado, botonPresionado) {
    if (respondido) return;
    respondido = true;

    let actual = preguntasQuiz[indicePreguntaActual];
    let botones = document.querySelectorAll('.btn-opcion');

    if (indiceSeleccionado === actual.respuesta) {
        botonPresionado.classList.add('correcto');
        puntaje += 25;
        document.getElementById('texto-puntaje').innerText = `Puntaje: ${puntaje}`;
    } else {
        botonPresionado.classList.add('incorrecto');
        // Mostrar cuál era la correcta
        botones[actual.respuesta].classList.add('correcto');
    }

    // Deshabilitar todos los botones
    botones.forEach(b => b.disabled = true);

    // Mostrar botón siguiente o finalizar
    let btnSiguiente = document.getElementById('btn-siguiente');
    if (indicePreguntaActual < preguntasQuiz.length - 1) {
        btnSiguiente.innerText = "Siguiente";
    } else {
        btnSiguiente.innerText = "Ver Resultados";
    }
    btnSiguiente.style.display = 'block';
}

function siguientePregunta() {
    indicePreguntaActual++;
    if (indicePreguntaActual < preguntasQuiz.length) {
        cargarPregunta();
    } else {
        mostrarResultadosFinales();
    }
}

function mostrarResultadosFinales() {
    document.getElementById('contenedor-quiz').style.display = 'none';
    document.getElementById('pantalla-final').style.display = 'block';
    document.getElementById('texto-resultado-final').innerText = `Has obtenido ${puntaje} puntos de 100 posibles. ¡Excelente trabajo completando el quiz del peregrino!`;
}

function reiniciarQuiz() {
    indicePreguntaActual = 0;
    puntaje = 0;
    document.getElementById('pantalla-final').style.display = 'none';
    document.getElementById('contenedor-quiz').style.display = 'block';
    cargarPregunta();
}

// Inicializar primer pregunta al cargar
cargarPregunta();
</script>

</body>
</html>
