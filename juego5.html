<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompecabezas del Peregrino - Rincón de la Lectura</title>
<link href="https://fonts.googleapis.com/css?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: linear-gradient(135deg, #e3f2fd, #fff3e0);
    font-family: 'Quicksand', sans-serif;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-family: 'Fredoka One', cursive;
    color: #3F51B5;
    font-size: 2.3rem;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
}

header p {
    font-size: 1.05rem;
    color: #555;
    font-weight: 700;
}

.juego-contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 100%;
}

.info-juego {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: #3F51B5;
}

/* TABLERO DEL ROMPECABEZAS (3x3) */
.tablero-puzzle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 330px;
    height: 330px;
    background: #e0e0e0;
    border: 4px solid #3F51B5;
    border-radius: 12px;
    gap: 2px;
    margin-bottom: 20px;
}

.pieza-puzzle {
    background-color: #ffffff;
    background-size: 330px 330px;
    border: 1px solid #ccc;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: #3F51B5;
    transition: background-color 0.2s;
}

.pieza-puzzle:hover {
    background-color: #f0f4c3;
}

.pieza-vacia {
    background: #f5f5f5 !important;
    border: none;
    cursor: default;
}

.acciones-inferiores {
    display: flex;
    gap: 15px;
    width: 100%;
    justify-content: center;
}

.btn-accion {
    background: #2ECC40;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #218838;
    transition: all 0.1s;
}

.btn-accion:active {
    transform: translateY(3px);
    box-shadow: none;
}

.btn-volver {
    background: #FF4136;
    box-shadow: 0 4px 0 #c82333;
    text-decoration: none;
    text-align: center;
    display: inline-block;
    padding: 12px 25px;
    border-radius: 50px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
}

/* MENSAJE DE VICTORIA */
#mensaje-victoria {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border: 5px solid #FFD700;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: aparecer 0.3s ease-out;
}

#mensaje-victoria h2 {
    font-family: 'Fredoka One', cursive;
    color: #2ECC40;
    font-size: 2rem;
    margin-bottom: 10px;
}

@keyframes aparecer {
    from { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
</style>
</head>
<body>

<header>
    <h1>5. Rompecabezas del Peregrino</h1>
    <p>¡Desliza las piezas para armar la imagen tradicional de nuestra devoción!</p>
</header>

<div class="juego-contenedor">
    <div class="info-juego">
        <span id="contador-movimientos">Movimientos: 0</span>
        <span>Misión: Ordenar del 1 al 8</span>
    </div>

    <!-- TABLERO DEL PUZZLE DESLIZANTE -->
    <div class="tablero-puzzle" id="tablero-puzzle"></div>

    <div class="acciones-inferiores">
        <button class="btn-accion" onclick="reiniciarPuzzle()">Reiniciar</button>
        <a href="javascript:window.close();" class="btn-volver">Cerrar Juego</a>
    </div>
</div>

<!-- VENTANA DE VICTORIA -->
<div id="mensaje-victoria">
    <h2>¡Rompecabezas Armado!</h2>
    <p>Has completado la imagen con destreza y devoción. ¡Felicitaciones!</p>
    <button class="btn-accion" onclick="reiniciarPuzzle(); cerrarVictoria();" style="margin-top: 15px;">Jugar de Nuevo</button>
</div>

<script>
// Configuración del Rompecabezas Deslizable 3x3 (8 números + espacio vacío representado por 0)
// Nota: Puedes cambiar 'imagen_puzzle.png' por tu archivo gráfico de fondo deseado.
const imagenFondoPuzzle = 'rompe.png';

let estadoActual = [1, 2, 3, 4, 5, 6, 7, 8, 0];
const estadoGanador = [1, 2, 3, 4, 5, 6, 7, 8, 0];
let movimientosPuzzle = 0;

function iniciarPuzzle() {
    movimientosPuzzle = 0;
    actualizarMarcadorPuzzle();
    document.getElementById('mensaje-victoria').style.display = 'none';
    
    // Barajar asegurando que sea un puzzle solucionable
    do {
        estadoActual = [1, 2, 3, 4, 5, 6, 7, 8, 0]
            .sort(() => Math.random() - 0.5);
    } while (!esSolucionable(estadoActual) || sonIguales(estadoActual, estadoGanador));

    renderizarTablero();
}

function esSolucionable(arr) {
    let inversiones = 0;
    let sinCero = arr.filter(n => n !== 0);
    for (let i = 0; i < sinCero.length - 1; i++) {
        for (let j = i + 1; j < sinCero.length; j++) {
            if (sinCero[i] > sinCero[j]) inversiones++;
        }
    }
    return inversiones % 2 === 0;
}

function sonIguales(a, b) {
    return a.every((val, index) => val === b[index]);
}

function renderizarTablero() {
    const tablero = document.getElementById('tablero-puzzle');
    tablero.innerHTML = '';

    estadoActual.forEach((valor, indice) => {
        const pieza = document.createElement('div');
        pieza.classList.add('pieza-puzzle');

        if (valor === 0) {
            pieza.classList.add('pieza-vacia');
        } else {
            pieza.innerText = valor;
            // Configuración visual de fondo dividida para simular recorte de imagen si existe el archivo
            pieza.style.backgroundImage = `url('${imagenFondoPuzzle}')`;
            let x = (valor - 1) % 3;
            let y = Math.floor((valor - 1) / 3);
            pieza.style.backgroundPosition = `-${x * 110}px -${y * 110}px`;
            
            pieza.addEventListener('click', () => intentarMover(indice));
        }
        tablero.appendChild(pieza);
    });
}

function intentarMover(indice) {
    const filaVacia = Math.floor(estadoActual.indexOf(0) / 3);
    const colVacia = estadoActual.indexOf(0) % 3;
    const filaPieza = Math.floor(indice / 3);
    const colPieza = indice % 3;

    // Verificar si está adyacente al espacio vacío (arriba, abajo, izquierda, derecha)
    const esAdyacente = (Math.abs(filaVacia - filaPieza) + Math.abs(colVacia - colPieza)) === 1;

    if (esAdyacente) {
        let indiceVacio = estadoActual.indexOf(0);
        // Intercambiar posiciones
        estadoActual[indiceVacio] = estadoActual[indice];
        estadoActual[indice] = 0;

        movimientosPuzzle++;
        actualizarMarcadorPuzzle();
        renderizarTablero();

        if (sonIguales(estadoActual, estadoGanador)) {
            setTimeout(() => {
                document.getElementById('mensaje-victoria').style.display = 'block';
            }, 300);
        }
    }
}

function actualizarMarcadorPuzzle() {
    document.getElementById('contador-movimientos').innerText = `Movimientos: ${movimientosPuzzle}`;
}

function cerrarVictoria() {
    document.getElementById('mensaje-victoria').style.display = 'none';
}

// Inicializar el juego al cargar la página
iniciarPuzzle();
</script>

</body>
</html>
